[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tfl-solver"
version = "1.0.0"
description = "Агент для решения задач по теории формальных языков (ИУ9, МГТУ им. Баумана)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Mickleburg", email = "yruloki@yandex.ru"}]

[project.urls]
Repository = "https://github.com/Mickleburg/tfl-solver"

[project.scripts]
tfl = "tfl.cli:main"
tfl-agent = "tfl.cli:main"

[project.optional-dependencies]
# Извлечение текста и рендер сканов из PDF курса
corpus = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pyyaml>=6"]
# Поиск матричных интерпретаций. Необязателен: проверка готовой
# интерпретации своя и от решателя не зависит, а модель печатается
# в smtlib для любого внешнего решателя.
smt = ["z3-solver>=4.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["tfl"]
